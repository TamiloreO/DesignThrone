# Xcode project definition. The .xcodeproj is generated, never committed:
# run `xcodegen generate` in this directory on a Mac.
#
# The app compiles the portable C++ core sources directly. They have no Apple
# dependencies, so there is nothing to configure beyond the C++ standard and the
# header search path.
name: VideoEditor

options:
  bundleIdPrefix: com.tamiloreo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  VideoEditor:
    type: application
    platform: iOS
    sources:
      - path: VideoEditor
      - path: ../core/src
    settings:
      base:
        PRODUCT_NAME: VideoEditor
        PRODUCT_BUNDLE_IDENTIFIER: com.tamiloreo.videoeditor
        INFOPLIST_FILE: VideoEditor/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: VideoEditor/VideoEditor-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../core/include
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: []
      gatherCoverageData: false
